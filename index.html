<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Marvel Draft Battle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e1331;--panel:#181f4d;--panel2:#212a63;--line:#343f86;--text:#f2f3ff;--muted:#a4aad8;
  --gold:#ffd23f;--gold-ink:#2a2100;--pink:#ff4fa3;--cyan:#29c5f6;--bad:#ff6b6b;--ok:#7ee081;
  --dot:rgba(255,255,255,.07);--goldtx:#ffd23f;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e8ebff;--panel:#ffffff;--panel2:#f1f3ff;--line:#c6cdf2;--text:#141a3c;--muted:#565d8c;--dot:rgba(20,26,60,.08);--gold:#f5c400;--goldtx:#a37800}}
:root[data-theme="dark"]{--goldtx:#ffd23f;--bg:#0e1331;--panel:#181f4d;--panel2:#212a63;--line:#343f86;--text:#f2f3ff;--muted:#a4aad8;--dot:rgba(255,255,255,.07)}
:root[data-theme="light"]{--bg:#e8ebff;--panel:#ffffff;--panel2:#f1f3ff;--line:#c6cdf2;--text:#141a3c;--muted:#565d8c;--dot:rgba(20,26,60,.08);--gold:#f5c400;--goldtx:#a37800}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:9px 9px;color:var(--text);font:16px/1.45 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:var(--disp);font-weight:800;line-height:.95;margin:0;letter-spacing:.01em}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:17px;background:var(--panel2);border:2px solid var(--line);min-height:52px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.35}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;font-size:15px}

/* ---------- home ---------- */
.hero{min-height:78vh;display:grid;place-content:center;text-align:center;gap:22px}
.logo{font-family:var(--disp);font-weight:900;font-size:clamp(64px,15vw,168px);line-height:.82;text-transform:uppercase;color:var(--text);
  text-shadow:-5px 3px 0 var(--pink),5px -3px 0 var(--cyan)}
.logo span{display:block}
.hero p{max-width:34ch;margin:0 auto;color:var(--muted);font-size:18px}
.hero .actions{display:grid;gap:10px;width:min(360px,100%);margin:10px auto 0}
.histChip{display:flex;align-items:center;gap:9px;width:min(360px,100%);margin:22px auto 0;padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:600 14px/1.3 var(--body);cursor:pointer;transition:border-color .15s ease,color .15s ease,transform .15s ease}
.histChip:hover{border-color:var(--gold);color:var(--text);transform:translateY(-1px)}
.histChip .hcNum{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--gold);line-height:1}
.histChip .hcLbl{flex:1;text-align:left}
.histChip .hcLbl b{color:var(--text);font-weight:700}
.histChip .hcArrow{color:var(--muted);font-size:20px;line-height:1}
.histList{display:flex;flex-direction:column;text-align:left}
.histRow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.histRow:last-child{border-bottom:0}
.histRow .hDate{color:var(--muted);font-size:13px;min-width:48px}
.histRow .hWin{flex:1;font-weight:700}
.histRow .hPl{color:var(--muted);font-size:13px}
.howto{max-width:620px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px 24px}
.howto ol{padding-left:22px;margin:12px 0}.howto li{margin:8px 0}

/* ---------- setup ---------- */
.setup{max-width:760px;margin:0 auto;display:grid;gap:16px}
.setup h2{font-size:clamp(42px,8vw,64px)}
.box{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px}
.box h3{font-size:26px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0}
.row+.row{border-top:1px solid var(--line)}
.row small{display:block;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);font-size:22px;font-weight:700}
.step b{min-width:40px;text-align:center;font-family:var(--disp);font-size:30px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.name{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:12px;padding:4px 4px 4px 12px;border:2px solid var(--line)}
.name i{width:14px;height:14px;border-radius:50%;flex:none}
.name input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:600 17px var(--body);padding:10px 4px}
.name input:focus{outline:none}.name:focus-within{border-color:var(--cyan)}
.seg{display:inline-flex;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:9px 14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.num{width:84px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font:700 18px var(--body);padding:9px;text-align:center}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--pink);flex:none;margin-top:2px}

/* ---------- game ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top .brand{font-family:var(--disp);font-weight:900;font-size:26px;text-transform:uppercase;text-shadow:-2px 1px 0 var(--pink),2px -1px 0 var(--cyan);margin-right:auto}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.top .btn{min-height:42px;padding:8px 14px;font-size:15px}
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:1fr}}
.stage{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:20px;min-width:0}
.turn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.turn h2{font-size:clamp(34px,6vw,54px)}
.turn .who{color:var(--pc)}

/* face-down cards */
.deck{display:flex;justify-content:center;gap:clamp(8px,3vw,28px);padding:34px 4px 20px}
.back{width:min(190px,calc((100% - 32px)/3));flex:none;aspect-ratio:5/7;border-radius:16px;border:4px solid var(--text);
  background:radial-gradient(rgba(255,255,255,.35) 1.6px,transparent 2px) 0 0/10px 10px,var(--pink);
  display:grid;place-items:center;font:900 clamp(56px,12vw,96px)/1 var(--disp);color:#fff;text-shadow:4px 4px 0 var(--bg);
  transition:transform .18s ease;box-shadow:6px 6px 0 var(--bg)}
.back:nth-child(1){transform:rotate(-4deg)}.back:nth-child(2){transform:rotate(1deg) translateY(-8px);background-color:var(--cyan)}.back:nth-child(3){transform:rotate(5deg)}
.back:hover,.back:focus-visible{transform:translateY(-14px) rotate(0)}
.hint{text-align:center;color:var(--muted);margin:0}

/* revealed card */
.reveal{display:grid;grid-template-columns:minmax(170px,240px) minmax(0,1fr);gap:22px;margin:18px 0 6px;align-items:center}
@media (max-width:560px){.reveal{grid-template-columns:1fr;justify-items:center;text-align:center}.face{max-width:170px}}
.face{width:100%;max-width:240px;aspect-ratio:5/7;border-radius:18px;border:4px solid var(--text);position:relative;overflow:hidden;
  background:radial-gradient(rgba(0,0,0,.28) 1.6px,transparent 2px) 0 0/9px 9px,var(--cc);box-shadow:8px 8px 0 var(--bg);display:grid;place-items:center}
.face .mono{font:900 clamp(78px,16vw,118px)/.8 var(--disp);color:#fff;text-shadow:5px 5px 0 rgba(0,0,0,.35)}
.face .form{position:absolute;left:10px;right:10px;bottom:10px;background:var(--text);color:var(--bg);border-radius:10px;padding:6px 8px;font-weight:700;font-size:14px;text-align:center}
.flip{animation:flip .55s cubic-bezier(.2,.7,.2,1.2)}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg) scale(.9)}to{transform:none}}
.info h2{font-size:clamp(40px,7vw,68px)}
.info .formname{font:700 20px var(--body);color:var(--cc2);margin:6px 0 10px}
.info p{margin:0;max-width:52ch}

/* price tag – the loud bit */
.tag{display:inline-flex;align-items:center;gap:14px;margin-top:16px;background:var(--gold);color:var(--gold-ink);border-radius:14px;padding:8px 18px 8px 10px;
  transform:rotate(-2deg);box-shadow:5px 5px 0 var(--pc)}
.tag .amt{font:900 50px/1 var(--disp);min-width:48px;text-align:center;background:var(--gold-ink);color:var(--gold);border-radius:10px;padding:4px 10px}
.tag .who{font:800 26px/1 var(--disp)}.tag small{display:block;font:600 13px var(--body);opacity:.75}
.bump{animation:bump .25s ease}@keyframes bump{50%{transform:rotate(-2deg) scale(1.08)}}

.dock{margin-top:22px;border-top:2px dashed var(--line);padding-top:16px;display:grid;gap:14px}
.dock h3{font-size:22px}
.bidders{display:flex;flex-wrap:wrap;gap:8px}
.bidder{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px;min-height:54px;display:flex;align-items:center;gap:10px;font-weight:700;text-align:left}
.bidder i{width:12px;height:36px;border-radius:6px;background:var(--pc);flex:none}
.bidder small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.bidder.on{border-color:var(--pc);background:var(--pc);color:#10142e}.bidder.on small{color:#10142e}.bidder.on i{background:#10142e}
.bidder:disabled{opacity:.3}
.coins{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.coin{aspect-ratio:1;border-radius:50%;border:3px solid var(--gold);background:transparent;color:var(--text);font:800 24px/1 var(--disp);min-height:48px}
.coin.on{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--gold)}
.coin:disabled{opacity:.18;border-style:dashed}
.award{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bidbar{position:sticky;bottom:0;background:var(--panel);margin-top:14px;padding:12px 2px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:grid;gap:8px;z-index:3}
.joincard .face.mini{max-width:220px;margin:0 auto}
@media (max-width:900px){.stage{max-height:calc(100dvh - 130px);overflow-y:auto;-webkit-overflow-scrolling:touch}.dock{position:sticky;bottom:-20px;background:var(--panel);margin:22px -20px -20px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-radius:0 0 20px 20px;z-index:3}}
.award .btn.gold{flex:1;min-width:240px;font-size:19px;min-height:60px}

.swap{display:grid;gap:8px}
.swap button{text-align:left;display:flex;justify-content:space-between;align-items:center}

/* roster */
.roster{display:grid;gap:10px}
.roster h3{font-size:24px;padding:0 4px}
.pt{background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--pc);border-radius:16px;padding:12px 14px}
.pt.now{border-color:var(--pc);box-shadow:0 0 0 3px var(--pc)}
.pt.out{opacity:.55}
.pt .hd{display:flex;align-items:center;gap:8px}
.pt .nm{font:800 24px/1 var(--disp);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .cn{font:900 30px/1 var(--disp);color:var(--goldtx)}.pt .cn small{font:600 12px var(--body);color:var(--muted);margin-left:3px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--panel2);border:1px solid var(--line)}
.badge.bad{background:var(--bad);border-color:var(--bad);color:#200}
.badge.go{background:var(--pc);border-color:var(--pc);color:#10142e}
.slots{display:flex;gap:5px;margin:10px 0 6px}
.slot{flex:1;aspect-ratio:1;max-width:46px;border-radius:9px;border:2px dashed var(--line);display:grid;place-items:center;font:800 16px var(--disp);color:#fff}
.slot.f{border:0;background:radial-gradient(rgba(0,0,0,.25) 1px,transparent 1.3px) 0 0/5px 5px,var(--cc)}
.slot.req{border-color:var(--muted)}
.team{margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.team li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team b{color:var(--text);font-weight:600}

/* overlay + end */
.ov{position:fixed;inset:0;background:rgba(5,8,25,.72);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;width:min(440px,100%);max-height:88vh;overflow:auto;display:grid;gap:10px}
.sheet h2{font-size:36px}
.end{display:grid;gap:18px}
.end>h2{font-size:clamp(48px,9vw,86px)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.res .team{font-size:15px}.res .team li{white-space:normal;padding:3px 0;border-bottom:1px solid var(--line)}
.crown{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;margin-top:10px}
.crown.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.pt.win{box-shadow:0 0 0 4px var(--gold)}
details.log{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
details.log summary{cursor:pointer;font-weight:700}
details.log ol{margin:10px 0 0;padding-left:22px;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v2 polish ---------- */
body{background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px),radial-gradient(ellipse 70% 40% at 50% -5%,rgba(255,79,163,.22),transparent 70%);background-size:9px 9px,100% 100%;background-attachment:fixed}
.stage{background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:0 12px 40px -18px #000}
.back{background-image:radial-gradient(rgba(255,255,255,.35) 1.6px,transparent 2px),linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%);background-size:10px 10px,100% 100%;cursor:pointer}
.back:hover{box-shadow:6px 6px 0 var(--bg),0 0 34px rgba(255,79,163,.6)}
.face{box-shadow:8px 8px 0 var(--bg),0 0 38px -6px var(--cc)}
.face svg,.face img{position:absolute;inset:0;width:100%;height:100%}
.face::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%) 120% 0/250% 100%;animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{to{background-position:-40% 0}}
.face .form{z-index:2;display:grid;gap:1px;line-height:1.1;padding:7px 8px}
.face .form b{font:800 19px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.face .form i{font-style:normal;font-size:12px;opacity:.75}
.slot{overflow:hidden;position:relative}.slot svg{width:100%;height:100%;display:block}
.exs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.ex{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.ex i{width:10px;height:10px;border-radius:50%;background:var(--pc)}.ex.done{border-color:var(--ok)}
.dock.auto{background:var(--panel2);border:2px solid var(--gold);border-radius:14px;padding:14px 16px}
.info h2{background:linear-gradient(90deg,var(--text),var(--cc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pt{transition:transform .15s}.pt.now{transform:translateX(-4px)}
#mbtn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:22px;box-shadow:0 6px 18px -6px #000;display:grid;place-items:center}
#mbtn.on{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,79,163,.35)}

/* ---------- v3: logo, motion, VFX ---------- */
.logo3{position:relative;display:grid;justify-items:center;line-height:.85;text-transform:uppercase;font-family:var(--disp);font-weight:900;isolation:isolate;margin:0;padding:34px 12px 22px;transform:rotate(-3deg)}
.logo3::before{content:'';position:absolute;inset:-30% -14%;z-index:-2;background:repeating-conic-gradient(rgba(255,210,63,.3) 0 6deg,transparent 6deg 16deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);animation:spin 45s linear infinite}
.logo3::after{content:'';position:absolute;inset:0;z-index:-3;background:radial-gradient(ellipse at 30% 50%,rgba(255,79,163,.35),transparent 60%),radial-gradient(ellipse at 75% 55%,rgba(41,197,246,.3),transparent 60%);filter:blur(18px)}
.logo3 .w{position:relative;display:block;filter:drop-shadow(5px 5px 0 var(--pink)) drop-shadow(10px 10px 0 rgba(0,0,0,.45));animation:slam .7s cubic-bezier(.2,.9,.3,1.3) backwards}
.logo3 .w::before{content:attr(data-t);position:absolute;inset:0;z-index:-1;color:#0b0f2b;-webkit-text-stroke:.09em #0b0f2b}
.logo3 .l1{font-size:clamp(66px,17vw,180px);color:transparent;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 130% 0/250% 100%,linear-gradient(180deg,#fff6b0,#ffd23f 45%,#ff8a1f);-webkit-background-clip:text;background-clip:text;animation:slam .7s cubic-bezier(.2,.9,.3,1.3) backwards,shine 4.5s 1.2s ease-in-out infinite}
.logo3 .l2{font-size:clamp(84px,22vw,236px);margin-top:-.04em;color:transparent;background:linear-gradient(180deg,#fff,#a8ecff 55%,#29c5f6);-webkit-background-clip:text;background-clip:text;animation-delay:.15s}
.logo3 .l3{font-size:clamp(34px,8.4vw,92px);margin-top:.16em;padding:.06em .55em .02em;letter-spacing:.2em;color:#fff;background:linear-gradient(90deg,#ff4fa3,#ff8a3d);border:.07em solid #0b0f2b;transform:skewX(-9deg);text-shadow:3px 3px 0 #0b0f2b;animation-delay:.3s}
.logo3 .l3::before{content:none}
.sp{position:absolute;width:26px;height:26px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:tw 2.6s ease-in-out infinite;z-index:3}
.top .brand{background:linear-gradient(180deg,#fff6b0,#ffd23f 60%,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(2px 2px 0 var(--pink))}
.fan{display:flex;justify-content:center;align-items:flex-end;height:clamp(110px,22vw,170px);margin-bottom:-6px}
.fc{width:clamp(70px,14vw,110px);aspect-ratio:5/7;border-radius:12px;border:3px solid var(--text);overflow:hidden;position:relative;margin:0 -12px;transform:rotate(var(--r)) translateY(var(--y));box-shadow:5px 5px 0 var(--bg),0 0 26px -6px var(--cc);animation:float 4s ease-in-out infinite,rise .7s backwards;animation-delay:var(--d)}
.fc svg{width:100%;height:100%;display:block}
@keyframes float{50%{transform:rotate(var(--r)) translateY(calc(var(--y) - 10px))}}
@keyframes slam{from{opacity:0;transform:scale(2.4) rotate(-6deg)}60%{transform:scale(.94)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes shine{to{background-position:-40% 0,0 0}}
@keyframes shine2{to{background-position:-60% 0}}

/* ---------- match history (persists across games, independent of the current session) ---------- */
const histLoad=()=>{try{return JSON.parse(localStorage.getItem('mdb-history'))||[]}catch(e){return[]}};
const histSave=h=>{try{localStorage.setItem('mdb-history',JSON.stringify(h.slice(0,10)))}catch(e){}};
const totLoad=()=>{try{return+localStorage.getItem('mdb-total-games')||0}catch(e){return 0}};
const totBump=()=>{try{localStorage.setItem('mdb-total-games',totLoad()+1)}catch(e){}};
function recordMatch(){if(G.recorded)return;G.recorded=true;
  const n=G.names,RP=G.rp||[],tot=n.map((_,i)=>RP.reduce((a,r)=>a+(r?r[i]:0),0));
  const winner=n[tot.indexOf(Math.max(...tot))];
  const h=histLoad();h.unshift({d:Date.now(),players:n.length,winner});histSave(h);totBump();
}
function finalizeMatch(){if(!G||G.screen!=='end'||G.recorded||!G.names||!G.names.length)return;
  let winner;
  if(G.win&&G.win.length)winner=G.win.map(i=>G.names[i]).join(' & ');
  else{const RP=G.rp||[];if(RP.length){const tot=G.names.map((_,i)=>RP.reduce((a,r)=>a+(r?r[i]:0),0));winner=G.names[tot.indexOf(Math.max(...tot))]}}
  if(!winner)return;
  G.recorded=true;const h=histLoad();h.unshift({d:Date.now(),players:G.names.length,winner});histSave(h);totBump();
}
const histFmt=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function historyChip(){const h=histLoad(),tot=totLoad();
  return`<button class=histChip onclick="G.histOpen=1;R()" aria-label="View game history"><span class=hcNum>${tot}</span><span class=hcLbl>game${tot==1?'':'s'} played${h.length?` · last won by <b>${esc(h[0].winner)}</b>`:''}</span><span class=hcArrow aria-hidden="true">›</span></button>`}
function historyModal(){const h=histLoad(),tot=totLoad();
  return`<div class=ov onclick="if(event.target===this){G.histOpen=0;R()}"><div class=sheet role=dialog aria-label="Game history">
  <h2>Game history</h2><p class=muted style="margin-top:-6px">${tot} game${tot==1?'':'s'} played in total</p>
  ${h.length?`<div class=histList>${h.slice(0,10).map(e=>`<div class=histRow><span class=hDate>${esc(histFmt(e.d))}</span><span class=hWin>👑 ${esc(e.winner)}</span><span class=hPl>${e.players}p</span></div>`).join('')}</div>`
    :`<p class=muted style="margin:0">No completed games yet — finish a draft to start your record.</p>`}
  <button class="btn primary wide" style="margin-top:18px" onclick="G.histOpen=0;R()">Close</button>
</div></div>`}

/* ---------- rules ---------- */
const N=()=>G.names.length;
const need=i=>Math.max(0,G.min-G.teams[i].length);
function maxBid(i){if(G.elim[i])return 0;let r=G.coins[i];if(G.guard&&G.phase=='draft')r-=Math.max(0,G.min-(G.teams[i].length+1));return Math.max(0,r)}
function canBid(i){if(G.elim[i]||G.coins[i]<1)return false;if(G.phase=='draft')return G.teams[i].length<G.max&&maxBid(i)>=1;return !G.exDone[i]}
const canEx=i=>!G.elim[i]&&G.coins[i]>=1&&!G.exDone[i];
const exElig=()=>G.names.map((_,i)=>i).filter(canEx);
function nextFrom(from){for(let k=1;k<=N();k++){const i=((from+G.dir*k)%N()+N())%N();if(canBid(i))return i}return -1}
function order(from){const o=[];for(let k=0;k<N();k++)o.push(((from+G.dir*k)%N()+N())%N());return o}
const pool=()=>{const u=new Set(G.used);return DB.map((_,i)=>i).filter(i=>!u.has(i))};
function deal(){const u=pool(),c=[];while(c.length<3&&u.length)c.push(u.splice(Math.random()*u.length|0,1)[0]);G.cards=c;G.pick=null;G.bid=null;G.stage='pick';if(!c.length)endGame()}
function checkElim(){G.names.forEach((_,i)=>{if(!G.elim[i]&&G.teams[i].length<G.min&&G.coins[i]<need(i)){G.elim[i]=true;G.log.push({t:'out',p:i})}})}
function snap(){const c={...G};delete c.hist;G.hist=(G.hist||[]).slice(-19).concat(JSON.stringify(c))}
function undo(){if(!G.hist||!G.hist.length)return toast('Nothing to undo');const h=G.hist,prev=JSON.parse(h.pop());G=Object.assign(prev,{hist:h});G.menu=0;R();toast('Last result undone')}

/* ---------- setup ---------- */
function newGame(){finalizeMatch();G={screen:'setup',s:{n:4,names:[],coins:20,max:5,min:4,ex:1,dir:1,first:'p1',guard:true,online:0,timer:0,code:rc(),rounds:3}};R()}
function st(k,d,lo,hi){const s=G.s;s[k]=Math.max(lo,Math.min(hi,s[k]+d));if(k=='max'&&s.min>s.max)s.min=s.max;if(k=='min'&&s.min>s.max)s.max=s.min;R()}
function setS(k,v){G.s[k]=v;if(k=='online'&&v)netHost();R()}
function begin(){const s=G.s;const names=Array.from({length:s.n},(_,i)=>(s.names[i]||'').trim()||'Player '+(i+1));
  if(s.coins<s.min)return toast('Starting coins must be at least '+s.min);
  G={screen:'game',names,start:s.coins,max:s.max,min:s.min,exOn:s.ex>0,exDone:names.map(_=>false),exQ:[],exNo:0,exTot:0,dir:s.dir,guard:s.guard,
     coins:names.map(_=>s.coins),teams:names.map(_=>[]),elim:names.map(_=>false),used:[],log:[],hist:[],phase:'draft',exRound:0,queue:[],win:[],round:1,rp:[],rk:[]};
  G.turn=s.first=='rand'?Math.random()*names.length|0:0;G.first0=G.turn;G.timer=s.timer;G.online=s.online;G.code=s.code;G.rounds=s.rounds||3;deal();R();if(G.online)netHost()}

/* ---------- play ---------- */
function reveal(k){G.pick=G.cards[k];G.stage='bid';const e=G.phase=='exchange'?exElig():[];
  G.bid=e.length==1?{p:e[0],a:1,auto:1}:{p:G.phase=='exchange'&&!e.includes(G.turn)?e[0]:G.turn,a:1};hist();fx.flip=1;R();SX.play('flip');burst($('.face'),26)}
function pickBidder(i){const b=G.bid;b.p=i;if(b.a>maxBid(i))b.a=Math.max(1,maxBid(i));fx.bump=1;hist();tmReset();R()}
function pickAmt(a){G.bid.a=a;fx.bump=1;hist();tmReset();R()}
function award(){const{p,a}=G.bid;if(!canBid(p)||a<1||a>maxBid(p))return toast('That bid is not allowed');
  snap();
  if(G.phase=='exchange'&&G.teams[p].length>=G.max){G.stage='swap';return R()}
  G.coins[p]-=a;G.teams[p].push(G.pick);G.used.push(G.pick);G.log.push({t:'win',p,c:G.pick,a,ph:G.phase});if(G.phase=='exchange')G.exDone[p]=true;
  toast(G.names[p]+' gets '+DB[G.pick].n);burst($('.tag'),40);SX.play('sold');after()}
function doSwap(j){const{p,a}=G.bid,out=G.teams[p][j];G.used=G.used.filter(x=>x!==out);G.teams[p][j]=G.pick;G.used.push(G.pick);G.coins[p]-=a;
  G.exDone[p]=true;G.log.push({t:'swap',p,c:G.pick,out,a});toast(G.names[p]+' swapped in '+DB[G.pick].n);after()}
function cancelSwap(){G.hist.pop();G.stage='bid';R()}
function passCard(){snap();G.log.push({t:'pass',c:G.pick,ph:G.phase});after()}
function after(){checkElim();
  if(G.phase=='draft'){const t=nextFrom(G.turn);if(t<0)return toExchange();G.turn=t;deal();return R()}
  nextEx()}
/* Exchange phase: every player draws ONE card, in table order. Only players who have not
   exchanged yet may bid, and each player can win at most one exchange. If exactly one
   eligible player is left, the drawn card goes to them by default for 1 coin. */
function toExchange(){if(!G.exOn||!exElig().length)return endGame();G.phase='exchange';G.exQ=order(G.first0).filter(i=>!G.elim[i]);G.exTot=G.exQ.length;G.exNo=0;nextEx()}
function nextEx(){if(!G.exQ.length||!exElig().length)return endGame();G.turn=G.exQ.shift();G.exNo++;deal();R()}
function skipToExchange(){if(!confirm('Stop the draft now and move to the exchange rounds?'))return;snap();G.menu=0;checkElim();
  if(G.phase=='draft')toExchange();else R()}
function endGame(){G.names.forEach((_,i)=>{if(G.teams[i].length<G.min)G.elim[i]=true});G.screen='end';G.menu=0;R();rain();SX.play('fan')}
function toggleWin(i){G.win=G.win.includes(i)?G.win.filter(x=>x!==i):G.win.concat(i);R()}

function legacyCopy(t){try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-9999px';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');document.body.removeChild(ta);return ok}catch(e){return false}}
function copyText(t,label,okMsg){
  const showBox=()=>{G.copyBox={title:label,text:t};G.aiP=0;R();setTimeout(()=>{const el=document.getElementById('copyBoxTa');if(el){el.focus();el.select()}},30)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast(okMsg)).catch(()=>{if(legacyCopy(t))toast(okMsg);else showBox()});
  }else{if(legacyCopy(t))toast(okMsg);else showBox()}
}

/* ---------- AI battle judge: master prompt ---------- */
const MASTER_PROMPT=`MARVEL COMIC-ACCURATE TEAM BATTLE RULES

We are playing a Marvel Comics 5-character team battle/draft game. Evaluate every character using comic-accurate powers, feats, abilities, scaling, and potential.

1. PEAK VERSION RULE
Always use the strongest legitimate comic portrayal of the character/form being named.

Alternate Earths, universes, timelines, and continuities are allowed if they contain a legitimate comic portrayal of that character/form.

Do NOT restrict the battle to Earth-616.

If a specific form is named, use the peak version of THAT EXACT FORM only.

Examples:
- Odinforce Thor = peak Odinforce Thor
- King Thor = peak King Thor
- Immortal Hulk = peak Immortal Hulk
- Maestro Hulk = peak Maestro
- Godbuster Iron Man = peak Godbuster Iron Man
- Godkiller Iron Man = peak Godkiller Iron Man
- Lifebringer Galactus = peak Lifebringer Galactus

Do not merge different forms together or give a character powers from another form just because that character has access to them in another incarnation.

2. TITLES ARE NOT AUTOMATICALLY FORMS
A title or status does not automatically mean a separate power form.

If a character's title represents a position, role, or status rather than a fundamentally different transformation, do not artificially create a separate form.

Example:
Knull is the King in Black. Treating "King in Black" as a title does not automatically mean that ordinary Knull is dramatically weaker.

For Knull specifically, his raw/inherent power should be judged at his peak potential. Do not automatically treat "Knull" and "Knull, King in Black" as completely separate transformations.

Apply the same logic to other Marvel characters where a title is a status rather than a genuine alternate power form.

3. RAW POWER RULE
Judge characters primarily by their own inherent comic-accurate abilities, powers, feats, durability, speed, intelligence, experience, hax, reality manipulation, magic, cosmic abilities, regeneration, resurrection, etc.

Use the character's actual demonstrated comic capabilities and established potential.

Do not use fan-made power scaling as fact.

Do not use MCU versions unless specifically requested.

4. NO ARMIES RULE
This is a 5-character team battle, so DO NOT count armies, followers, minions, troops, or large external forces as additional combat power.

Examples that normally should NOT count:
- Knull's symbiote army
- Doombots
- Ultron's armies
- armies of demons
- armies of followers
- armies of summoned creatures
- other large groups controlled by a character

This would be unfair because one character could effectively become an entire team.

ONLY include an army/external force if it is genuinely an inseparable and intrinsic part of that character's own power and cannot reasonably be separated from the character.

The default rule is:
CHARACTER'S OWN POWER > ARMY/EXTERNAL RESOURCES.

5. TEAM BATTLE RULE
Do NOT judge the teams simply by comparing their strongest individual characters.

Evaluate the entire five-character team.

A single extremely powerful character should NOT automatically carry a team consisting of four weak/street-level characters against another team containing multiple comparable cosmic/high-tier characters.

Consider:
- Overall team power
- Number of high-tier/cosmic characters
- Power distribution
- Offensive capability
- Defensive capability
- Hax/counters
- Speed
- Durability
- Battlefield control
- Intelligence
- Regeneration/healing
- Resurrection/revival
- Reality manipulation
- Magic
- Cosmic abilities
- Ability interaction
- Team synergy
- Team diversity

6. POWER-TIER BALANCE
If Team A has one extremely powerful cosmic character but four relatively weak characters, while Team B has several extremely powerful cosmic characters, do not automatically give Team A the victory because of its single strongest character.

Multiple characters operating at similar extraordinary levels can create a major team advantage through combined attacks, defense, counters, and battlefield control.

Judge the actual five-vs-five interaction.

7. TEAM BONDING AND EXPERIENCE
Give a SMALL advantage to teams whose members have strong established comic relationships and have fought together extensively.

Consider:
- Long-term teamwork
- Shared battles
- Trust
- Understanding of each other's abilities
- Established coordination
- Team tactics
- Strong character bonds

This is only a secondary factor.

Team bonding must NOT overcome a massive raw-power difference.

8. TEAM DIVERSITY
Give a SMALL advantage to teams with a diverse combination of abilities.

For example:
- Long-range attacks
- Close-range combat
- Extreme strength
- Speed
- Cosmic power
- Reality manipulation
- Magic
- Telepathy
- Intelligence
- Strategy
- Defense
- Healing/regeneration
- Resurrection/revival
- Energy manipulation
- Power absorption
- Sealing/counter abilities
- Battlefield control

A diverse team can deal with more types of threats and cover each other's weaknesses.

Again, diversity is a secondary advantage and cannot automatically overcome a huge power difference.

9. FAIRNESS
The objective is to determine the most plausible result of a comic-accurate five-character battle.

Do not favor a team simply because it contains one famous or exceptionally powerful character.

Do not artificially weaken cosmic characters.

Do not artificially inflate weaker characters.

Do not count optional armies or followers.

Use the strongest legitimate comic portrayal of the exact forms specified.

10. FINAL OUTPUT FORMAT
When I provide multiple teams, DO NOT give a long character-by-character explanation unless I specifically ask for it.

Simply rank the teams:

1st — Team [Name]
2nd — Team [Name]
3rd — Team [Name]
4th — Team [Name]
etc.

Then give approximately 2–3 short lines for each team explaining the important factors considered:
- Overall power
- Number of high-tier characters
- Team synergy/bonding
- Diversity
- Counters
- Balance
- Comic-accurate abilities

const SUPABASE_URL='https://rommhkinoxzwhcqngdts.supabase.co';

let SB=null,ROOMS={};

async function netInit(){
  if(NET!==null)return NET;
  try{
    if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase library unavailable');
    SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const handlers={};
    NET={
      async room(code){
        code=String(code||'').toUpperCase();
        if(!code)throw new Error('Missing room code');
        if(ROOMS[code])return ROOMS[code];
        const ch=SB.channel('mdb-room-'+code,{config:{broadcast:{self:true}}});
        Object.keys(handlers).forEach(ev=>ch.on('broadcast',{event:ev},m=>handlers[ev].forEach(fn=>fn({data:m.payload}))));
        await new Promise((resolve,reject)=>{
          let settled=false;
          ch.subscribe(status=>{
            if(status==='SUBSCRIBED'){settled=true;resolve()}
            else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){settled=true;reject(new Error(status))}
          });
          setTimeout(()=>{if(!settled)reject(new Error('Realtime connection timed out'))},10000);
        });
        ROOMS[code]=ch;
        return ch;
      },
      on(ev,fn){
        (handlers[ev]||(handlers[ev]=[])).push(fn);
        Object.values(ROOMS).forEach(ch=>ch.on('broadcast',{event:ev},m=>fn({data:m.payload})));
      },
      async emit(ev,data){
        const ch=await this.room(data&&data.c);
        return ch.send({type:'broadcast',event:ev,payload:data});
      }
    };
  }catch(e){
    console.error('Supabase Realtime init failed:',e);
    NET=false;
  }
  return NET;
}
